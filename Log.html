<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Secure System & Code Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Phetsarath OT', 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0284c7);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            color: #ffffff;
            transition: all 0.4s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p { color: #94a3b8; font-size: 14px; }

        .input-box { margin-bottom: 18px; text-align: left; }
        .input-box label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
        .input-box input {
            width: 100%;
            padding: 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .input-box input:focus { border-color: #38bdf8; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #9333ea);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); }

        #error-msg {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 10px;
            color: #fca5a5;
            font-size: 14px;
            text-align: center;
        }

        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Dashboard */
        #dashboard-screen { display: none; }

        .all-messages-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
            text-align: left;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .msg-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #38bdf8;
            border-radius: 12px;
            padding: 16px;
        }
        .msg-card.code-type { border-left-color: #a855f7; }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .msg-header h4 { font-size: 14px; color: #38bdf8; }

        .code-box {
            background: #090d16;
            color: #4ade80;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            white-space: pre;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            line-height: 1.4;
        }

        .btn-copy {
            padding: 6px 12px;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid #a855f7;
            color: #d8b4fe;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-copy:hover { background: #a855f7; color: #fff; }

        .btn-logout {
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            color: #fca5a5;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="glass-container" id="main-box">
    
    <!-- 1. FORM LOGIN -->
    <div id="login-screen">
        <div class="header">
            <h1>🔐 CODE & SCRIPT HUB</h1>
            <p>ເຂົ້າສູ່ລະບົບເພື່ອເບິ່ງໂຄ້ດ ແລະ ຂໍ້ຄວາມທັງໝົດ</p>
        </div>

        <div class="input-box">
            <label>ຊື່ຜູ້ໃຊ້ (Username)</label>
            <input type="text" id="username" placeholder="ປ້ອນຊື່ຜູ້ໃຊ້...">
        </div>

        <div class="input-box">
            <label>ລະຫັດຜ່ານ (Password)</label>
            <input type="password" id="password" placeholder="ປ້ອນລະຫັດຜ່ານ...">
        </div>

        <button class="btn-submit" onclick="handleLogin()">ເຂົ້າສູ່ລະບົບ</button>
        <div id="error-msg">ລະຫັດ ຫຼື ຊື່ຜູ້ໃຊ້ຜິດ...</div>
    </div>

    <!-- 2. DASHBOARD -->
    <div id="dashboard-screen">
        <div class="header">
            <h1 id="user-name">ສະບາຍດີ!</h1>
            <p>ລາຍການໂຄ້ດ ແລະ ຂໍ້ຄວາມທັງໝົດຂອງທ່ານ</p>
        </div>

        <div class="all-messages-container" id="messages-list"></div>

        <button class="btn-logout" onclick="handleLogout()">ອອກຈາກລະບົບ</button>
    </div>

</div>

<script>
    // 📊 ຂໍ້ມູນຜູ້ໃຊ້ ແລະ ໂຄ້ດ Matrix Prank ຂອງ San (ຄົບຖ້ວນ 100%)
    const database = [
        {
            user: "Hackker",
            pass: "Prank",
            name: "555",
            messages: [
                {
                    title: "📌 ຂໍ້ຄວາມຕ້ອນຮັບ",
                    isCode: false,
                    content: "ຍິນດີຕ້ອນຮັບ San! ດ້ານລຸ່ມນີ້ແມ່ນໂຄ້ດ Batch File ຂອງທ່ານ."
                },
                {
                    title: "💻 Hacking / Prank Batch Script (.bat)",
                    isCode: true,
                    content: `@echo off
title HACKING SYSTEM...
color 0A
mode con cols=80 lines=30

echo INITIALIZING SYSTEM...
ping 127.0.0.1 -n 3 >nul

set count=0
:matrix
echo %random%%random%%random%%random%%random%%random%%random%%random%%random%%random%
ping 127.0.0.1 -n 1 >nul
set /a count+=1
if %count% lss 50 goto matrix

cls
echo =========================================
echo       CRITICAL WARNING: SYSTEM FAILURE
echo =========================================
echo.
echo Initiating Emergency Shutdown in 5 seconds...
echo.

for /l %%i in (5,-1,1) do (
    echo Shutting down in %%i...
    ping 127.0.0.1 -n 2 >nul
)
echo Shutting down in 0...
ping 127.0.0.1 -n 2 >nul

shutdown /s /t 0 /c "Prank Completed!"`
                }
            ]
        }
    ];

    function handleLogin() {
        const uInput = document.getElementById("username").value.trim();
        const pInput = document.getElementById("password").value.trim();
        const mainBox = document.getElementById("main-box");
        const errorMsg = document.getElementById("error-msg");

        const foundUser = database.find(item => item.user === uInput && item.pass === pInput);

        if (foundUser) {
            errorMsg.style.display = "none";
            document.getElementById("user-name").innerText = foundUser.name;

            const msgContainer = document.getElementById("messages-list");
            msgContainer.innerHTML = "";

            foundUser.messages.forEach((m, index) => {
                const card = document.createElement("div");
                card.className = `msg-card ${m.isCode ? 'code-type' : ''}`;
                
                if (m.isCode) {
                    card.innerHTML = `
                        <div class="msg-header">
                            <h4>${m.title}</h4>
                            <button class="btn-copy" onclick="copyCode('code-${index}')">📋 Copy Code</button>
                        </div>
                        <pre class="code-box" id="code-${index}">${escapeHTML(m.content)}</pre>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="msg-header">
                            <h4>${m.title}</h4>
                        </div>
                        <p style="font-size: 14px; color: #cbd5e1; line-height: 1.5;">${m.content}</p>
                    `;
                }
                msgContainer.appendChild(card);
            });

            document.getElementById("login-screen").style.display = "none";
            document.getElementById("dashboard-screen").style.display = "block";

        } else {
            errorMsg.style.display = "block";
            errorMsg.innerText = "ລະຫັດ ຫຼື ຊື່ຜູ້ໃຊ້ຜິດ...";

            mainBox.classList.remove("shake");
            void mainBox.offsetWidth;
            mainBox.classList.add("shake");
        }
    }

    function copyCode(elementId) {
        const codeText = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(codeText).then(() => {
            alert("ກັອບປີ້ໂຄ້ດຮຽບຮ້ອຍແລ້ວ! 📋");
        });
    }

    function escapeHTML(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function handleLogout() {
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("error-msg").style.display = "none";
        document.getElementById("dashboard-screen").style.display = "none";
        document.getElementById("login-screen").style.display = "block";
    }
</script>

</body>
</html>
