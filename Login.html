<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບເຂົ້າສູ່ລະບົບ</title>
    <style>
        * {
            font-family: "Phetsarath OT", serif !important;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #4fa84d 0%, #1e5822 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* ຈັດຮູບແບບ Form ລັອກອິນ */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #4fa84d;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }

        .btn-login {
            background: #4fa84d;
            color: white;
            margin-top: 10px;
        }

        .btn-logout {
            background: #e53e3e;
            color: white;
            margin-top: 20px;
        }

        /* ກ່ອງແຈ້ງເຕືອນ Error */
        #error-box {
            margin-top: 15px;
            padding: 10px;
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        /* UI ເມື່ອລັອກອິນສຳເລັດ (Dashboard UI) */
        #welcome-screen {
            display: none; /* ເຊື່ອງໄວ້ກ່ອນ */
        }

        .avatar {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .user-title {
            color: #2d3748;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .notice-box {
            background: #f7fafc;
            border-left: 4px solid #4fa84d;
            padding: 12px 15px;
            text-align: left;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #e6fffa;
            color: #234e52;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 1. UI ໜ້າລັອກອິນ -->
    <div id="login-screen">
        <h2 style="margin-bottom: 20px; color: #333;">ເຂົ້າສູ່ລະບົບ</h2>
        
        <div class="input-group">
            <label>ຊື່ຜູ້ໃຊ້</label>
            <input type="text" id="username" placeholder="ປ້ອນຊື່ຜູ້ໃຊ້...">
        </div>
        
        <div class="input-group">
            <label>ລະຫັດຜ່ານ</label>
            <input type="password" id="password" placeholder="ປ້ອນລະຫັດຜ່ານ...">
        </div>

        <button class="btn btn-login" onclick="login()">ລັອກອິນ</button>
        <div id="error-box"></div>
    </div>

    <!-- 2. UI ຂໍ້ຄວາມສະແດງແຍກ ເມື່ອລັອກອິນສຳເລັດ -->
    <div id="welcome-screen">
        <div class="avatar" id="user-icon">👤</div>
        <span class="badge" id="user-role">Role</span>
        <h2 class="user-title" id="welcome-title">ຍິນດີຕ້ອນຮັບ</h2>
        
        <div class="notice-box">
            <p id="user-notice" style="color: #4a5568; font-size: 14px; line-height: 1.5;"></p>
        </div>

        <button class="btn btn-logout" onclick="logout()">ອອກຈາກລະບົບ</button>
    </div>
</div>

<script>
    // ຂໍ້ມູນຜູ້ໃຊ້ແຕ່ລະຄົນ (ສາມາດປ່ຽນ/ເພີ່ມ ຂໍ້ຄວາມແຍກກັນໄດ້ຢູ່ບ່ອນນີ້)
    const accounts = [
        {
            user: "san",
            pass: "23102014",
            icon: "👑",
            role: "Owner / Admin",
            title: "ສະບາຍດີ San!",
            notice: "📌 ຂໍ້ຄວາມປະກາດ: ລະບົບເຮັດວຽກປົກກະຕິ. ທ່ານມີສິດຈັດການຂໍ້ມູນທັງໝົດໃນ Dashboard ໄດ້."
        },
        {
            user: "Phetmeshaiy",
            pass: "ເມລະດາ ອິນທະວົງ",
            icon: "👀",
            role: "ຄົນທົ່ວໄປ",
            title: "ຍິນດີຕ້ອນຮັບ Phetmeshaiy",
            notice: "🚀 ຂໍ້ຄວາມປະກາດ:ຂອບໃຈທີ່ໃຊ້ບໍລິການ! ທ່ານໄດ້ຮັບຄຣີສຳລັບແມພ steal an egg [jYWElfmvYqhzAdYytnjZwIElFazAXiTa] ຂອບໃຈເດີ Phetmeshaiy"
        },
        {
            user: "Mexai",
            pass: "ອາຈານ",
            icon: "⭐",
            role: "VIP Member",
            title: "ຍິນດີຕ້ອນຮັບ ສະມາຊິກ VIP!",
            notice: "🎁 ຂໍ້ຄວາມປະກາດ: ຂອບໃຈທີ່ໃຊ້ບໍລິການ! ທ່ານໄດ້ຮັບຄຣີສຳລັບແມພ steal an egg [hEbrGpbiuLCnwJWnuVjlIIIDDxCKaMxY] ຂອບໃຈເດີ Mexaiy"
        }
    ];

    function login() {
        const userInput = document.getElementById("username").value.trim();
        const passInput = document.getElementById("password").value.trim();
        const errorBox = document.getElementById("error-box");

        // ກວດສອບ username & password
        const foundAccount = accounts.find(acc => acc.user === userInput && acc.pass === passInput);

        if (foundAccount) {
            // ຊ່ອນ Error Box (ຖ້າມີ)
            errorBox.style.display = "none";

            // ໃສ່ຂໍ້ມູນແຍກຕາມ User ທີ່ລັອກອິນເຂົ້າ Secret/Welcome UI
            document.getElementById("user-icon").innerText = foundAccount.icon;
            document.getElementById("user-role").innerText = foundAccount.role;
            document.getElementById("welcome-title").innerText = foundAccount.title;
            document.getElementById("user-notice").innerText = foundAccount.notice;

            // ເຊື່ອງໜ້າ Login ແລ້ວ ເປີດໜ້າ Dashboard/Welcome ແຍກ
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("welcome-screen").style.display = "block";
        } else {
            // ຖ້າຜິດ ເປີດ Error Box
            errorBox.style.display = "block";
            errorBox.innerText = "ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານ ບໍ່ຖືກຕ້ອງ!";
        }
    }

    function logout() {
        // ລ້າງຄ່າ Password
        document.getElementById("password").value = "";
        
        // ສະຫຼັບກັບມາໜ້າ Login
        document.getElementById("welcome-screen").style.display = "none";
        document.getElementById("login-screen").style.display = "block";
    }
</script>

</body>
</html>
